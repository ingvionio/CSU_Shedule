services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: csu_schedule
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csu_schedule"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Все настройки бэкенда (админ, JWT, SMTP, push, Moodle) — в backend/.env,
    # шаблон — backend/.env.example. Файл обязателен: без него compose не
    # стартует, а не запускается молча с пустыми секретами.
    env_file:
      - ./backend/.env
    environment:
      # Внутри docker-сети Postgres доступен по имени сервиса; перекрывает
      # DATABASE_URL из backend/.env, который нужен для запуска без Docker.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/csu_schedule
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: python -m app.cli worker
    env_file:
      - ./backend/.env
    environment:
      # Внутри docker-сети Postgres доступен по имени сервиса; перекрывает
      # DATABASE_URL из backend/.env, который нужен для запуска без Docker.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/csu_schedule
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
