# Замена /etc/systemd/system/csu-backend.service.d/10-release-venv.conf.
# Раньше здесь был путь к venv конкретного релиза; теперь — ссылка
# releases/current, которую переключает выкладка (DEPLOY.md), и тот же
# Python использует csu-worker. Пустой ExecStart сбрасывает прежний.

[Service]
ExecStart=
ExecStart=/home/antigravity/csu_schedule/releases/current/venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1
